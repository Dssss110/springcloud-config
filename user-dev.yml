server:
  port: 9001

spring:
  application:
    name: yue0shop-user

  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3307/springcloud?characterEncoding=UTF8&useSSL=false
    username: root
    password: 123456

  # JPA 配置
  jpa:
    show-sql: true
    generate-ddl: true
    database: mysql

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8888/eureka
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.yue0.controller  # 只扫描你的接口，关闭默认示例
  default-produces-media-type: application/json
